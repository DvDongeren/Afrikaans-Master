# Bouwt de website, test hem en zet hem live op Firebase.
# Draait bij elke wijziging op main. Faalt een test, dan blijft de oude site online.
name: Bouwen, testen en publiceren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      audio_key: ${{ steps.audiokey.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hulpmiddelen installeren (verkleinen, tests, uitspraak)
        run: |
          npm install -g esbuild@0.25.0
          pip install playwright==1.56.0 "google-auth>=2.30,<3" "requests>=2.31,<3"

      # Uitspraakbestanden: eerdere bestanden hergebruiken, alleen nieuwe teksten aanvragen.
      - name: Uitspraak uit cache halen
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: audio-cache
          key: audio-${{ hashFiles('bron/data.json', 'bron/tools/uitspraak.py') }}
          restore-keys: audio-

      - name: Uitspraak maken (Google Text-to-Speech)
        id: audio
        if: github.event_name != 'pull_request'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p audio-cache
          if [ -z "$SA" ]; then echo "n=$(ls audio-cache | wc -l)" >> "$GITHUB_OUTPUT"; echo "Geen sleutel; uitspraak overgeslagen."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" python3 bron/tools/maak_uitspraak.py audio-cache || echo "::warning::Uitspraak maken mislukt; site wordt zonder nieuwe bestanden gebouwd."
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Uitspraak in cache bewaren
        id: audiokey
        if: github.event_name != 'pull_request'
        run: echo "key=audio-${{ hashFiles('bron/data.json', 'bron/tools/uitspraak.py') }}-$(ls audio-cache | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && !endsWith(steps.audiokey.outputs.key, '-0') && steps.restore.outputs.cache-matched-key != steps.audiokey.outputs.key
        continue-on-error: true
        with:
          path: audio-cache
          key: ${{ steps.audiokey.outputs.key }}

      - name: Website bouwen
        run: python3 bron/build.py

      - name: JavaScript controleren
        run: |
          if [ -d bron/js ]; then cat bron/js/*.js; else cat bron/app.js; fi > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"

      - name: Testbrowser installeren
        run: python3 -m playwright install --with-deps chromium

      - name: Tests draaien
        run: python3 tests/run_all.py

      - name: Snelheid en toegankelijkheid meten (Lighthouse)
        continue-on-error: true
        run: |
          npx --yes @lhci/cli@0.14.0 collect --config=.lighthouserc.json
          python3 tests/lighthouse_rapport.py .lighthouseci

      - name: Gebouwde site bewaren (downloadbaar bij deze run)
        uses: actions/upload-artifact@v6
        with:
          name: website
          path: public/
          retention-days: 30

      - name: Publiceren op Firebase
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Geheim FIREBASE_SERVICE_ACCOUNT ontbreekt nog; de site is gebouwd en getest maar niet gepubliceerd. Zie README.md."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          PROJECT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['project_id'])" "$RUNNER_TEMP/sa.json")
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive --message "GitHub ${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/sa.json"

  # Voorbeeldversie op GitHub Pages (zonder inloggen, niet vindbaar in zoekmachines).
  # Vereist eenmalig: Settings > Pages > Source: GitHub Actions.
  preview:
    needs: build-test-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verkleiner installeren
        run: npm install -g esbuild@0.25.0
      - name: Uitspraak uit cache halen
        uses: actions/cache/restore@v4
        with:
          path: audio-cache
          key: ${{ needs.build-test-deploy.outputs.audio_key }}
          restore-keys: audio-
      - name: Voorbeeldversie bouwen
        run: SITE_BASE="/${GITHUB_REPOSITORY#*/}/" PREVIEW=1 python3 bron/build.py preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - id: deploy
        uses: actions/deploy-pages@v4
